<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Burger Place</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
    <header class="hero-nav">
        <a href="index.html" class="brand">Burger Place</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <div class="contact-content">
                <h2 class="contact-title">Contact Us</h2>

                <div class="contact-info">
                    <div class="contact-item">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                        <span>+33 1 23 45 67 89</span>
                    </div>

                    <div class="contact-item">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <span>hello@burgerplace.com</span>
                    </div>

                    <div class="contact-item">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <span>123 Culinary Avenue, Paris, France</span>
                    </div>
                </div>

                <form class="contact-form" onsubmit="handleContactSubmit(event)">
                    <input type="text" name="name" class="contact-input" placeholder="Your Name" required>
                    <input type="email" name="email" class="contact-input" placeholder="Your Email" required>
                    <textarea name="message" class="contact-textarea" placeholder="Your Message" required></textarea>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-logo">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:middle; margin-right:8px; margin-bottom:5px;"><path d="M3 17h18"></path><path d="M6 13a6 6 0 0 1 12 0v4H6v-4z"></path><path d="M12 9V7"></path><path d="M11 7h2"></path></svg>
            Burger Place
        </div>
        <p class="footer-text">123 Culinary Avenue | +33 1 23 45 67 89</p>
        <p class="footer-text" style="font-size: 0.8rem;">&copy; 2026 Burger Place. All rights reserved.</p>
    </footer>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        /*
        EMAILJS SETUP INSTRUCTIONS TO MAKE CONTACT FORM SEND EMAILS TO mhpk2010@gmail.com:

        1. Go to https://www.emailjs.com/ and create a free account
        2. Add an email service (Gmail, Outlook, etc.) and connect your mhpk2010@gmail.com account
        3. Create an email template with these variables:
           - {{from_name}} - Customer's name
           - {{from_email}} - Customer's email  
           - {{message}} - Customer's message
           - {{reply_to}} - Set to {{from_email}} for replies
        4. Replace the placeholders below with your actual EmailJS credentials from your dashboard
        */

        // EmailJS Configuration - REPLACE WITH YOUR ACTUAL CREDENTIALS
        const EMAILJS_CONFIG = {
            SERVICE_ID: 'service_a3xwoau',    // From EmailJS > Email Services
            TEMPLATE_ID: 'template_lxdl0kk',  // From EmailJS > Email Templates  
            PUBLIC_KEY: 'GsRfkSlAk1__eWGyk'     // From EmailJS > Account > General
        };

        // Initialize EmailJS
        (function(){
            emailjs.init(EMAILJS_CONFIG.PUBLIC_KEY);
        })();

        function handleContactSubmit(event) {
            event.preventDefault();
            
            // Show loading state
            const submitBtn = event.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;

            const formData = new FormData(event.target);
            const templateParams = {
                from_name: formData.get('name'),
                from_email: formData.get('email'),
                message: formData.get('message'),
                to_email: 'mhpk2010@gmail.com',
                reply_to: formData.get('email')
            };

            emailjs.send(EMAILJS_CONFIG.SERVICE_ID, EMAILJS_CONFIG.TEMPLATE_ID, templateParams)
                .then(function(response) {
                    alert('Thank you! Your message has been sent successfully. We\'ll get back to you soon!');
                    event.target.reset();
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }, function(error) {
                    alert('Sorry, there was an error sending your message. Please try again or contact us directly.');
                    console.error('EmailJS error:', error);
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                });
        }
    </script>
</body>
</html>
