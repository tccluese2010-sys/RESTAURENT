<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Burger Place</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero-nav">
        <a href="index.html" class="brand">Burger Place</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="menu-section">
            <h2 class="section-title">Our Menu</h2>
            <div class="menu-feature">
                <img src="Whisk_0b05bca323ebe3897cd4cc956e892635dr.jpeg" alt="Cool Drinks" class="menu-feature-img">
                <div class="menu-feature-copy">
                    <span class="eyebrow">Cool Drinks</span>
                    <h3>Chilled Refreshments</h3>
                    <p>Experience our premium drink collection crafted to pair perfectly with every burger, fry, and dessert.</p>
                </div>
            </div>
            <div class="menu-controls">
                <input type="text" id="search-input" placeholder="Search menu items..." class="search-input">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-category="all">All</button>
                    <button class="filter-btn" data-category="burgers">Burgers</button>
                    <button class="filter-btn" data-category="sides">Sides</button>
                    <button class="filter-btn" data-category="drinks">Drinks</button>
                    <button class="filter-btn" data-category="desserts">Desserts</button>
                </div>
            </div>
            <div class="menu-grid" id="menu-grid">
                <!-- Menu items will be populated by JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-logo">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:middle; margin-right:8px; margin-bottom:5px;"><path d="M3 17h18"></path><path d="M6 13a6 6 0 0 1 12 0v4H6v-4z"></path><path d="M12 9V7"></path><path d="M11 7h2"></path></svg>
            Burger Place
        </div>
        <p class="footer-text">123 Culinary Avenue | +33 1 23 45 67 89</p>
        <p class="footer-text" style="font-size: 0.8rem;">&copy; 2026 Burger Place. All rights reserved.</p>
    </footer>

    <script>
        // Menu Data
        const menuItems = [
            {
                id: 1,
                title: 'Classic Burger',
                desc: 'Juicy beef patty with lettuce, tomato, onion, pickles, and our special sauce on a toasted bun.',
                price: '$12.99',
                img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80',
                category: 'burgers'
            },
            {
                id: 2,
                title: 'Crispy Fries',
                desc: 'Golden crispy fries seasoned with sea salt, served with our signature garlic aioli.',
                price: '$5.99',
                img: 'https://images.unsplash.com/photo-1551782450-a2132b4ba21d?auto=format&fit=crop&w=600&q=80',
                category: 'sides'
            },
            {
                id: 3,
                title: 'Chicken Shawarma',
                desc: 'Marinated chicken wrapped in pita bread with garlic sauce, pickles, and fresh vegetables.',
                price: '$11.99',
                img: 'https://images.unsplash.com/photo-1529003926-7e77d0d3a48b?auto=format&fit=crop&w=600&q=80',
                category: 'burgers'
            },
            {
                id: 4,
                title: 'Chicken Nuggets',
                desc: 'Crispy breaded chicken nuggets served with honey mustard and barbecue sauce.',
                price: '$8.99',
                img: 'https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=600&q=80',
                category: 'sides'
            },
            {
                id: 5,
                title: 'Cold Drink',
                desc: 'Refreshing cola drink served ice cold in a classic glass bottle.',
                price: '$3.99',
                img: 'https://images.unsplash.com/photo-1510626176961-4b37b8430c43?auto=format&fit=crop&w=600&q=80',
                category: 'drinks'
            },
            {
                id: 6,
                title: 'Chocolate Brownie',
                desc: 'Rich chocolate brownie with vanilla ice cream and chocolate sauce.',
                price: '$6.99',
                img: 'https://images.unsplash.com/photo-1606312619070-d48b4c652a52?auto=format&fit=crop&w=600&q=80',
                category: 'desserts'
            },
            {
                id: 7,
                title: 'Cheese Burger',
                desc: 'Classic beef patty topped with melted cheddar cheese, lettuce, tomato, and our special sauce.',
                price: '$13.99',
                img: 'https://images.unsplash.com/photo-1571091718767-18b5b1457add?auto=format&fit=crop&w=600&q=80',
                category: 'burgers'
            },
            {
                id: 8,
                title: 'Veggie Burger',
                desc: 'Plant-based patty with avocado, sprouts, tomato, and vegan mayo on a whole wheat bun.',
                price: '$11.99',
                img: 'https://images.unsplash.com/photo-1520072959219-c595dc870360?auto=format&fit=crop&w=600&q=80',
                category: 'burgers'
            },
            {
                id: 9,
                title: 'Onion Rings',
                desc: 'Crispy battered onion rings served with ranch dipping sauce.',
                price: '$6.99',
                img: 'https://images.unsplash.com/photo-1639024471283-03518883512d?auto=format&fit=crop&w=600&q=80',
                category: 'sides'
            },
            {
                id: 10,
                title: 'Coleslaw',
                desc: 'Creamy coleslaw with fresh cabbage, carrots, and a tangy dressing.',
                price: '$4.99',
                img: 'https://images.unsplash.com/photo-1551467847-0d94aab95e51?auto=format&fit=crop&w=600&q=80',
                category: 'sides'
            },
            {
                id: 11,
                title: 'Lemonade',
                desc: 'Freshly squeezed lemonade with a hint of mint, served ice cold.',
                price: '$4.99',
                img: 'https://images.unsplash.com/photo-1621263764928-df1444c5e859?auto=format&fit=crop&w=600&q=80',
                category: 'drinks'
            },
            {
                id: 12,
                title: 'Iced Tea',
                desc: 'Chilled black tea with lemon slices and a touch of sweetness.',
                price: '$3.99',
                img: 'https://images.unsplash.com/photo-1544148103-0773bf10d330?auto=format&fit=crop&w=600&q=80',
                category: 'drinks'
            },
            {
                id: 13,
                title: 'Vanilla Ice Cream',
                desc: 'Creamy vanilla ice cream scoop topped with chocolate chips.',
                price: '$5.99',
                img: 'https://images.unsplash.com/photo-1567206563064-6f60f40a2b57?auto=format&fit=crop&w=600&q=80',
                category: 'desserts'
            },
            {
                id: 14,
                title: 'Cheesecake',
                desc: 'New York style cheesecake with strawberry compote and whipped cream.',
                price: '$7.99',
                img: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=600&q=80',
                category: 'desserts'
            }
        ];

        // Populate Menu
        const menuGrid = document.getElementById('menu-grid');

        menuItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'menu-card';
            card.setAttribute('data-category', item.category);
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        <div class="menu-img-container">
                            <img src="${item.img}" alt="${item.title}" class="menu-img">
                        </div>
                        <div class="menu-title-front">${item.title}</div>
                    </div>
                    <div class="card-back">
                        <div class="menu-content">
                            <h3 class="menu-title">${item.title}</h3>
                            <p class="menu-desc">${item.desc}</p>
                            <div class="menu-price">${item.price}</div>
                            <button class="btn btn-ar" onclick="addToCart('${item.title}'); event.stopPropagation();">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="9" cy="21" r="1"></circle>
                                    <circle cx="20" cy="21" r="1"></circle>
                                    <path d="m1 1 4 4h15l-1 7H6"></path>
                                </svg>
                                Add to Cart
                            </button>
                        </div>
                    </div>
                </div>
            `;
            card.addEventListener('click', () => {
                card.classList.toggle('flipped');
            });
            menuGrid.appendChild(card);
        });

        // Filtering and Search
        let currentCategory = 'all';
        let searchTerm = '';

        function filterCards() {
            const cards = document.querySelectorAll('.menu-card');
            cards.forEach(card => {
                const category = card.getAttribute('data-category');
                const title = card.querySelector('.menu-title').textContent.toLowerCase();
                const matchesCategory = currentCategory === 'all' || category === currentCategory;
                const matchesSearch = title.includes(searchTerm.toLowerCase());
                if (matchesCategory && matchesSearch) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.getAttribute('data-category');
                filterCards();
            });
        });

        // Search input
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            filterCards();
        });

        // Add to Cart function
        function addToCart(itemName) {
            alert(`${itemName} added to cart!`);
        }

        // Intersection Observer for scroll animations
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('visible');
                    }, index * 100);
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15, rootMargin: "0px 0px -80px 0px" });

        document.querySelectorAll('.menu-card').forEach(card => {
            observer.observe(card);
        });

        // Scroll animations for section titles
        const titleObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('in-view');
                    titleObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.3 });

        document.querySelectorAll('.section-title').forEach(title => {
            titleObserver.observe(title);
        });
    </script>
</body>
</html>
